<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFUS iPad Calculator</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f4f3;
    margin: 0;
    padding: 10px;
    font-size: 15px;
}

.container {
    max-width: 1024px;
    margin: auto;
    background: #fff;
    padding: 16px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 22px;
    margin: 6px 0 10px;
    color: #2f8f2f;
}

.top-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
}

.top-bar div {
    background: #f7f7f7;
    padding: 8px;
    border-radius: 10px;
}

.main-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 12px;
}

.card {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
}

.card-title {
    font-weight: bold;
    margin-bottom: 6px;
    color: #2f8f2f;
}

.tri {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 6px;
}

input {
    padding: 8px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
}

button {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    background: #2f8f2f;
    color: white;
    border: none;
    border-radius: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
}

th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
}

th {
    background: #2f8f2f;
    color: white;
}

.ref-image {
    width: 100%;
    height: auto;
    max-height: 620px;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
}

.notice {
    margin-top: 8px;
    background: #e9f6e8;
    padding: 10px;
    border-radius: 10px;
    font-weight: bold;
    color: #2f8f2f;
    text-align: center;
}
.clear-btn {
    background: #e5e5e5;
    color: #333;
    font-size: 16px;
}

</style>
</head>

<body>

<div class="container">
<h1>MFUS Treatment Calculator</h1>

<div class="top-bar">
    <div>
        <strong>Patient #</strong><br>
        <input id="patientId" placeholder="Patient ID">
    </div>
    <div>
        <strong>Date / Time</strong><br>
        <span id="datetime"></span>
    </div>
</div>

<div class="main-grid">

<!-- LEFT SIDE: INPUT + RESULTS -->
<div>

<div class="card">
<div class="card-title">Left Face</div>
A
<div class="tri">
<input class="la"><input class="la"><input class="la">
</div>
B
<div class="tri">
<input class="lb"><input class="lb"><input class="lb">
</div>
</div>

<div class="card">
<div class="card-title">Right Face</div>
A
<div class="tri">
<input class="ra"><input class="ra"><input class="ra">
</div>
B
<div class="tri">
<input class="rb"><input class="rb"><input class="rb">
</div>
</div>

<div class="card">
<div class="card-title">Submental (C)</div>
<div class="tri">
<input class="sc"><input class="sc"><input class="sc">
</div>
</div>

<button onclick="calculate()">CALCULATE</button>

<div id="results" style="display:none">

<table>
<tr><th>Area</th><th>A Avg</th><th>B Avg</th><th>C Avg</th></tr>
<tr>
<td>Left</td>
<td id="avg-la"></td>
<td id="avg-lb"></td>
<td rowspan="2" id="avg-c"></td>
</tr>
<tr>
<td>Right</td>
<td id="avg-ra"></td>
<td id="avg-rb"></td>
</tr>
</table>

<table>
<tr><th>Region</th><th>Transducer Selection</th></tr>
<tr><td>Left Face</td><td id="sel-left"></td></tr>
<tr><td>Right Face</td><td id="sel-right"></td></tr>
<tr><td>Submental</td><td id="sel-sub"></td></tr>
</table>

<div class="notice">
📸 Please take a screenshot to save this record
</div>

</div>
</div>

<script>
function avg(cls){
    let v=[...document.querySelectorAll("."+cls)]
    .map(x=>parseFloat(x.value))
    .filter(x=>!isNaN(x));
    return v.length?(v.reduce((a,b)=>a+b)/v.length):null;
}

function decideSingle(A,B){
    if(A>=4.5){
        if(B>=4.5) return "Use 4.5 & 3.0";
        if(B>=3.0) return "Use 3.0 & 2.0";
        if(B>=2.0) return "Use 2.0 Only";
        return "Prohibited";
    } else if(A>=3.0){
        if(B>=3.0) return "Use 3.0 & 2.0";
        if(B>=2.0) return "Use 2.0 Only";
        return "Prohibited";
    } else if(A>=2.0){
        if(B>=2.0) return "Use 2.0 Only";
        return "Prohibited";
    }
    return "Prohibited";
}

function decideSub(C){
    return C>=4.5 ? "Use 4.5 & 3.0" : "Use 3.0 Only";
}

function calculate(){
    let la=avg("la"), lb=avg("lb");
    let ra=avg("ra"), rb=avg("rb");
    let c=avg("sc");

    document.getElementById("avg-la").innerText=la?.toFixed(2)||"-";
    document.getElementById("avg-lb").innerText=lb?.toFixed(2)||"-";
    document.getElementById("avg-ra").innerText=ra?.toFixed(2)||"-";
    document.getElementById("avg-rb").innerText=rb?.toFixed(2)||"-";
    document.getElementById("avg-c").innerText=c?.toFixed(2)||"-";

    document.getElementById("sel-left").innerText=decideSingle(la,lb);
    document.getElementById("sel-right").innerText=decideSingle(ra,rb);
    document.getElementById("sel-sub").innerText=decideSub(c);

    document.getElementById("results").style.display="block";
    document.getElementById("clearBtn").style.display = "block";
}
    function clearAll() {
    // Clear all measurement inputs
    document.querySelectorAll("input").forEach(i => i.value = "");

    // Hide results + clear button
    document.getElementById("results").style.display = "none";
    document.getElementById("clearBtn").style.display = "none";

    // Clear result text
    [
        "avg-la","avg-lb","avg-ra","avg-rb","avg-c",
        "sel-left","sel-right","sel-sub"
    ].forEach(id => document.getElementById(id).innerText = "");
}


function updateTime(){
    document.getElementById("datetime").innerText=new Date().toLocaleString();
}
updateTime();
setInterval(updateTime,1000);
</script>
